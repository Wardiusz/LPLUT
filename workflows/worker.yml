name: Deploy Worker (Cloudflare)

# Opcjonalne: wdraża usługę skanowania, gdy zmieni się coś w worker/.
# Wymaga sekretów repozytorium CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID.
# Klucze AI (ANTHROPIC_API_KEY, GEMINI_API_KEY) i ACCESS_CODE ustaw raz w panelu Cloudflare:
# wdrożenie ich nie nadpisuje.
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
